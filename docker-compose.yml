version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: flipflag_db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: flipflag
      POSTGRES_PASSWORD: flipflag123
      POSTGRES_DB: flipflag
      NODE_ENV: development
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build: ./src
    container_name: flipflag_backend
    ports:
      - "3001:3001"
    depends_on:
      - postgres
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://flipflag:flipflag123@postgres:5432/flipflag
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: flipflag
      DB_USER: flipflag
      DB_PASSWORD: flipflag123
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: flipflag_pgadmin
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      - postgres
    restart: unless-stopped

  # frontend:
  #   build: ./frontend
  #   container_name: flipflag_frontend
  #   ports:
  #     - "5173:5173"
  #   depends_on:
  #     - backend
  #   environment:
  #     VITE_API_URL: http://localhost:3000
  #   restart: unless-stopped

volumes:
  pgdata: