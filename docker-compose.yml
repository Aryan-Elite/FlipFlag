version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: flipflag_db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: flipflag
      POSTGRES_PASSWORD: flipflag123
      POSTGRES_DB: flipflag
      NODE_ENV: development
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build: ./src
    container_name: flipflag_backend
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: flipflag
      DB_USER: flipflag
      DB_PASSWORD: flipflag123
    restart: unless-stopped

  # frontend:
  #   build: ./frontend
  #   container_name: flipflag_frontend
  #   ports:
  #     - "5173:5173"
  #   depends_on:
  #     - backend
  #   environment:
  #     VITE_API_URL: http://localhost:3000
  #   restart: unless-stopped

volumes:
  pgdata: